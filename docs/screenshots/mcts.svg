<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="470" rx="10" fill="#17181c"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e0574f"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5aa9e6"/>
    </marker>
  </defs>

  <!-- ══════════ 1 · SELECT ══════════ -->
  <text x="40" y="48" fill="#e8e6e3" font-size="19" font-weight="600">1 · Select</text>
  <text x="40" y="74" fill="#9aa0a6" font-size="13.5">Walk down the tree, each step taking the child</text>
  <text x="40" y="93" fill="#9aa0a6" font-size="13.5">with the best score plus an exploration bonus.</text>

  <path d="M185,152 L115,227" stroke="#4a4f57" stroke-width="2" fill="none"/>
  <path d="M185,152 L255,227" stroke="#3fb950" stroke-width="3.5" fill="none"/>
  <path d="M255,227 L200,302" stroke="#4a4f57" stroke-width="2" fill="none"/>
  <path d="M255,227 L305,302" stroke="#3fb950" stroke-width="3.5" fill="none"/>
  <circle cx="185" cy="150" r="21" fill="#2a2d33" stroke="#3fb950" stroke-width="3"/>
  <circle cx="115" cy="229" r="18" fill="#2a2d33" stroke="#4a4f57" stroke-width="2"/>
  <circle cx="255" cy="229" r="21" fill="#2a2d33" stroke="#3fb950" stroke-width="3"/>
  <circle cx="198" cy="304" r="18" fill="#2a2d33" stroke="#4a4f57" stroke-width="2"/>
  <circle cx="307" cy="304" r="21" fill="#2a2d33" stroke="#3fb950" stroke-width="3"/>
  <text x="185" y="156" fill="#e8e6e3" font-size="12.5" text-anchor="middle">root</text>
  <text x="272" y="183" fill="#3fb950" font-size="12.5" font-weight="600">best</text>
  <text x="322" y="258" fill="#3fb950" font-size="12.5" font-weight="600">best</text>
  <text x="307" y="345" fill="#9aa0a6" font-size="12.5" text-anchor="middle">leaf</text>

  <!-- ══════════ 2 · EXPAND &amp; EVALUATE ══════════ -->
  <text x="430" y="48" fill="#e8e6e3" font-size="19" font-weight="600">2 · Expand &amp; evaluate</text>
  <text x="430" y="74" fill="#9aa0a6" font-size="13.5">Add the leaf's children. Instead of playing the game</text>
  <text x="430" y="93" fill="#9aa0a6" font-size="13.5">out at random, ask the network who is winning.</text>

  <path d="M545,152 L480,227" stroke="#4a4f57" stroke-width="2" fill="none"/>
  <path d="M545,152 L615,227" stroke="#4a4f57" stroke-width="2" fill="none"/>
  <path d="M615,227 L565,302" stroke="#4a4f57" stroke-width="2" fill="none"/>
  <path d="M615,227 L662,302" stroke="#4a4f57" stroke-width="2" fill="none"/>
  <path d="M655,325 L622,378" stroke="#d98b3a" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="M672,325 L706,378" stroke="#d98b3a" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <circle cx="545" cy="150" r="18" fill="#2a2d33" stroke="#4a4f57" stroke-width="2"/>
  <circle cx="478" cy="229" r="18" fill="#2a2d33" stroke="#4a4f57" stroke-width="2"/>
  <circle cx="615" cy="229" r="18" fill="#2a2d33" stroke="#4a4f57" stroke-width="2"/>
  <circle cx="563" cy="304" r="18" fill="#2a2d33" stroke="#4a4f57" stroke-width="2"/>
  <circle cx="664" cy="304" r="21" fill="#2a2d33" stroke="#d98b3a" stroke-width="3"/>
  <circle cx="618" cy="390" r="14" fill="#20232a" stroke="#d98b3a" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="710" cy="390" r="14" fill="#20232a" stroke="#d98b3a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="664" y="420" fill="#c58436" font-size="12" text-anchor="middle">new children</text>

  <rect x="740" y="268" width="130" height="72" rx="9" fill="#1f2a37" stroke="#5aa9e6" stroke-width="2"/>
  <text x="805" y="296" fill="#8fc7f0" font-size="13.5" text-anchor="middle" font-weight="600">neural net</text>
  <text x="805" y="317" fill="#9aa0a6" font-size="12" text-anchor="middle">one forward pass</text>
  <path d="M689,296 L735,289" stroke="#5aa9e6" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <path d="M738,318 L692,314" stroke="#5aa9e6" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <text x="805" y="362" fill="#8fc7f0" font-size="12.5" text-anchor="middle">priors <tspan font-style="italic">p</tspan> · value <tspan font-style="italic">v</tspan></text>

  <!-- ══════════ 3 · BACK UP ══════════ -->
  <text x="920" y="48" fill="#e8e6e3" font-size="19" font-weight="600">3 · Back up</text>
  <text x="920" y="74" fill="#9aa0a6" font-size="13.5">Send <tspan font-style="italic">v</tspan> back up the path, updating</text>
  <text x="920" y="93" fill="#9aa0a6" font-size="13.5">every node's average score and visit count.</text>

  <path d="M1063,283 L1024,248" stroke="#e0574f" stroke-width="3.5" fill="none" marker-end="url(#ar)"/>
  <path d="M1002,208 L975,175" stroke="#e0574f" stroke-width="3.5" fill="none" marker-end="url(#ar)"/>
  <path d="M960,152 L900,227" stroke="#4a4f57" stroke-width="2" fill="none"/>
  <path d="M1013,227 L963,302" stroke="#4a4f57" stroke-width="2" fill="none"/>
  <circle cx="960" cy="150" r="21" fill="#2a2d33" stroke="#e0574f" stroke-width="3"/>
  <circle cx="898" cy="229" r="18" fill="#2a2d33" stroke="#4a4f57" stroke-width="2"/>
  <circle cx="1013" cy="229" r="21" fill="#2a2d33" stroke="#e0574f" stroke-width="3"/>
  <circle cx="961" cy="304" r="18" fill="#2a2d33" stroke="#4a4f57" stroke-width="2"/>
  <circle cx="1080" cy="304" r="21" fill="#2a2d33" stroke="#e0574f" stroke-width="3"/>
  <text x="1082" y="268" fill="#e0574f" font-size="13.5" font-weight="600">+ <tspan font-style="italic">v</tspan></text>
  <text x="1022" y="192" fill="#e0574f" font-size="13.5" font-weight="600">+ <tspan font-style="italic">v</tspan></text>
  <text x="1080" y="345" fill="#9aa0a6" font-size="12.5" text-anchor="middle">evaluated leaf</text>

  <text x="600" y="450" fill="#7d838b" font-size="13.5" text-anchor="middle">Repeat a few hundred times, then play the move that was visited most often — those visit counts are also the training target.</text>
</svg>
